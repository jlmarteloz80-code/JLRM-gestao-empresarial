const STORAGE_PREFIX="jlrm_fallback_";
const state={page:"dashboard",user:null,data:{lancamentos:[],contas:[],clientes:[],funcionarios:[],gestores:[],produtos:[],metas:[],investimentos:[],configuracoes:{empresa:"JLRM Gestão Empresarial Profissional",moeda:"BRL",tema:"claro",versao:"2.1"}},search:"",chart:null,chartModes:{dashboard:"pie",reports:"pie"},dashboardMonth:"",server:false,chat:[],reportPeriod:"month",reportDate:"",reportStart:"",reportEnd:""};
const titles={dashboard:"Resumo geral",financeiro:"Entradas e despesas",contas:"Contas a pagar e receber",relatorios:"Relatórios",metas:"Metas",clientes:"Clientes e fornecedores",funcionarios:"Funcionários",gestores:"Gestores",produtos:"Estoque e produtos",investimentos:"Investimentos",simulador:"Simular investimentos",assistente:"Assistente JLRM",configuracoes:"Configurações e backup",usuarios:"Logins de acesso"};
const $=s=>document.querySelector(s),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>"jlrm_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8),today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`},money=n=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:state.data.configuracoes.moeda||"BRL"}).format(Number(n)||0),fmtDate=s=>{if(!s)return "—";const d=new Date(s+"T12:00:00");return isNaN(d)?"—":d.toLocaleDateString("pt-BR")},monthKey=s=>String(s||"").slice(0,7),monthNow=()=>today().slice(0,7),sum=arr=>arr.reduce((a,b)=>a+(Number(b.valor)||0),0),isPaid=c=>c.status==="pago"||c.status==="recebido";

function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove("show"),3000)}
async function api(path,options={}){const r=await fetch(path,options);let body;try{body=await r.json()}catch{if(!r.ok){const error=new Error("Servidor: "+r.status);error.status=r.status;throw error}throw new Error("O servidor retornou uma resposta inválida.")}if(!r.ok){const detail=body.detail?" "+body.detail:"",code=body.code?" ["+body.code+"]":"",error=new Error((body.error||"Servidor: "+r.status)+code+detail);error.status=r.status;error.code=body.code;throw error}return body}
async function loadData(){if(!window.OrbeAuth||typeof window.OrbeAuth.requireSession!=="function"){document.querySelector(".app").style.display="none";document.body.insertAdjacentHTML("beforeend",'<main style="max-width:560px;margin:12vh auto;padding:28px;background:white;border:1px solid #e4e8f0;border-radius:16px;font:14px/1.5 system-ui"><h1 style="margin-top:0">Atualize o servidor</h1><p>O servidor em execução ainda não tem o login novo. Pare o servidor antigo e inicie novamente com <code>node server.js</code> dentro da pasta do projeto.</p></main>');return}state.user=await window.OrbeAuth.requireSession();if(!state.user)return;try{const r=await api("/api/dados");for(const k of Object.keys(DB_FILES))if(r[k]!==undefined)state.data[k]=r[k];state.server=true}catch(e){toast("Não foi possível carregar os dados. Confira se o servidor está iniciado e se sua sessão está ativa.");return}try{const preferences=await api("/api/auth/preferences");state.data.configuracoes={...state.data.configuracoes,...preferences.preferences}}catch(e){toast(e.status===404?"Servidor desatualizado: reinicie o servidor Node para carregar as preferências da conta.":"Não foi possível carregar as preferências desta conta.");return}if(!Array.isArray(state.data.gestores))state.data.gestores=[];applyTheme();render()}
async function saveData(key){if(!state.server){toast("Servidor local indisponível. Os dados não foram salvos.");return false}try{const endpoint=key==="configuracoes"?"/api/auth/preferences":"/api/dados/"+key;await api(endpoint,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(state.data[key])});if(key==="configuracoes")applyBranding();return true}catch(e){toast((e.message||"Falha ao salvar.")+(e.code?" ("+e.code+")":""));return false}}
function applyBranding(){const company=String(state.data.configuracoes.empresa||"JLRM Gestão Empresarial Profissional").trim()||"JLRM Gestão Empresarial Profissional",brand=$("#brandName"),mark=$("#brandMark"),appleTitle=document.querySelector('meta[name="apple-mobile-web-app-title"]'),manifest=document.querySelector('link[rel="manifest"]');document.title=company;if(brand)brand.textContent=company;if(mark)mark.textContent=company.charAt(0).toUpperCase();if(appleTitle)appleTitle.content=company;if(manifest)manifest.href="/manifest.webmanifest?v="+encodeURIComponent(company)}
function applyTheme(){document.body.classList.toggle("dark",state.data.configuracoes.tema==="escuro");applyBranding()}
function updateQuickAction(){const button=$("#quickAdd"),label=button.querySelector(".btn-label"),action={dashboard:["lancamentos","Novo lançamento"],financeiro:["lancamentos","Novo lançamento"],contas:["contas","Nova conta"],relatorios:["metas","Nova meta"],clientes:["clientes","Novo cliente"],funcionarios:["funcionarios","Novo funcionário"],gestores:["gestores","Novo gestor"],produtos:["produtos","Novo produto"],investimentos:["investimentos","Novo investimento"]}[state.page];button.hidden=!action;if(!action)return;button.dataset.form=action[0];button.setAttribute("aria-label",action[1]);label.textContent=action[1]}
function navTo(page){state.page=page;state.search="";document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));$("#topTitle").textContent=titles[page]||"JLRM";$("#sidebar").classList.remove("open");updateQuickAction();render()}
function render(){updateQuickAction();const root=$("#content"),pages={dashboard:renderDashboard,financeiro:renderFinance,contas:renderAccounts,relatorios:renderPeriodReports,clientes:()=>renderRecords("clientes"),funcionarios:()=>renderRecords("funcionarios"),gestores:()=>renderRecords("gestores"),produtos:renderProductRecords,investimentos:renderInvestments,simulador:renderInvestmentSimulator,assistente:renderAssistant,configuracoes:renderSettings,usuarios:()=>typeof window.renderUsersPage==="function"?window.renderUsersPage():`<section class="panel"><div class="notice warn">Atualize o servidor Node para carregar o gerenciamento de logins.</div></section>`};root.innerHTML=(pages[state.page]||renderDashboard)();if(state.page==="dashboard"){addDailyEntryCard();drawDashboardDistribution()}if(state.page==="relatorios"){ensureChartTypeControl("reports","reportChart");drawPeriodReportChart()}if(state.page==="investimentos")drawInvestmentChart();if(state.page==="simulador"&&simulatorLast)drawSimulatorChart()}
function addDailyEntryCard(){const cards=$("#content .cards");if(!cards)return;cards.classList.add("dashboard-cards");const todayItems=state.data.lancamentos.filter(item=>String(item.data||"").slice(0,10)===today()),entries=sum(todayItems.filter(item=>item.tipo==="entrada")),expenses=sum(todayItems.filter(item=>item.tipo==="despesa")),invested=sum(state.data.investimentos||[]);cards.insertAdjacentHTML("beforeend",card("Saldo disponível",money(currentCashBalance()),"◈","Saldo inicial + entradas − despesas pagas","positive")+card("Entradas de hoje",money(entries),"↗","Receitas registradas hoje","positive")+card("Saídas de hoje",money(expenses),"↘","Despesas registradas hoje","negative")+card("Total investido",money(invested),"▰","Soma dos valores aplicados cadastrados","positive"))}
function currentCashBalance(){const opening=Number(state.data.configuracoes.saldoInicialCaixa)||0,entries=sum(state.data.lancamentos.filter(item=>item.tipo==="entrada")),paidExpenses=sum(state.data.lancamentos.filter(item=>item.tipo==="despesa"&&item.situacaoPagamento!=="Pendente")),settledAccountsWithoutMovement=state.data.contas.filter(account=>isPaid(account)&&!state.data.lancamentos.some(item=>item.contaId===account.id)),receivedAccounts=settledAccountsWithoutMovement.filter(account=>account.tipo==="receber").reduce((total,account)=>total+(Number(account.valor)||0),0),paidAccounts=settledAccountsWithoutMovement.filter(account=>account.tipo==="pagar").reduce((total,account)=>total+(Number(account.valor)||0),0);return opening+entries+receivedAccounts-paidExpenses-paidAccounts}
function pageHead(title,desc,action=""){return `<div class="page-head"><div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function card(label,value,icon,note,cls=""){return `<div class="metric"><div class="metric-top"><span>${label}</span><span class="metric-icon">${icon}</span></div><div class="metric-value ${cls}">${value}</div><div class="metric-note">${note}</div></div>`}
function currentLaunches(){return state.data.lancamentos.filter(x=>monthKey(x.data||x.criadoEm)===state.dashboardMonth)}
function setDashboardMonth(month){if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(month))return;state.dashboardMonth=month;render()}
function dashboardMonthLabel(){return new Date(`${state.dashboardMonth}-01T12:00:00`).toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}
function renderDashboard(){const l=currentLaunches(),ins=sum(l.filter(x=>x.tipo==="entrada")),outs=sum(l.filter(x=>x.tipo==="despesa")),balance=ins-outs,due=state.data.contas.filter(c=>!isPaid(c)&&c.vencimento&&c.vencimento<today()).length,upcoming=state.data.contas.filter(c=>!isPaid(c)&&c.vencimento&&c.vencimento>=today()).sort((a,b)=>a.vencimento.localeCompare(b.vencimento)).slice(0,5),recent=[...state.data.lancamentos].sort((a,b)=>(b.data||"").localeCompare(a.data||"")).slice(0,5);return `${pageHead("Resumo completo da empresa","Bom dia, boa tarde ou boa noite! Acompanhe gastos, receitas e resultados.",`<div class="dashboard-month-filter"><label for="dashboardMonth">Ver mês:</label><input id="dashboardMonth" type="month" value="${esc(state.dashboardMonth)}" onchange="setDashboardMonth(this.value)"><button type="button" class="btn small" onclick="setDashboardMonth(monthNow())">Este mês</button></div>`)}<div class="cards">${card(`Entradas — ${dashboardMonthLabel()}`,money(ins),"↗",`Total recebido em ${dashboardMonthLabel()}`,"positive")}${card(`Despesas — ${dashboardMonthLabel()}`,money(outs),"↘",`Total lançado em ${dashboardMonthLabel()}`,"negative")}${card("Lucro do mês",money(balance),"◈","Entradas menos despesas",balance>=0?"positive":"negative")}${card("Contas atrasadas",String(due),"◷",due?"Precisam de atenção":"Nenhuma conta vencida",due?"negative":"positive")}</div><div class="grid2"><section class="panel"><div class="panel-head"><div><h2>Para onde foram as entradas?</h2><div class="panel-sub">Despesas por categoria e investimentos como percentual das entradas de ${dashboardMonthLabel()}.</div></div></div><div id="dashboardDistribution" class="dashboard-distribution"></div><div id="dashboardInsights" class="dashboard-insights" aria-live="polite"></div></section><section class="panel"><div class="panel-head"><div><h2>Próximas contas</h2><div class="panel-sub">Contas ainda não quitadas</div></div><button class="btn small" onclick="navTo('contas')">Ver todas</button></div>${upcoming.length?`<div class="activity">${upcoming.map(c=>`<div class="activity-item"><div class="activity-icon">${c.tipo==="receber"?"↙":"↗"}</div><div class="activity-text"><strong>${esc(c.descricao||c.nome||"Conta")}</strong><small>Vence ${fmtDate(c.vencimento)}</small></div><div class="activity-amount">${money(c.valor)}</div></div>`).join("")}</div>`:`<div class="empty">Nenhuma conta futura cadastrada.</div>`}</section></div><section class="panel"><div class="panel-head"><div><h2>Últimos lançamentos</h2><div class="panel-sub">Movimentações recentes registradas</div></div><button class="btn small" onclick="navTo('financeiro')">Ver financeiro</button></div>${recent.length?launchTable(recent,true):`<div class="empty">Ainda não há lançamentos.</div>`}</section><div class="footer-note">${state.server?"Conectado ao servidor local · dados em arquivos TXT":"Modo demonstração: dados guardados neste navegador. Para gravar automaticamente nos TXT, inicie o servidor local."}</div>`}
function dashboardDistributionData(){const launches=currentLaunches(),income=sum(launches.filter(item=>item.tipo==="entrada")),categories=new Map();launches.filter(item=>item.tipo==="despesa").forEach(item=>{const name=String(item.categoria||"Geral").trim()||"Geral";categories.set(name,(categories.get(name)||0)+(Number(item.valor)||0))});const expenses=[...categories].map(([label,value])=>({label,value,color:"#f59e0b"})).sort((a,b)=>b.value-a.value),invested=sum((state.data.investimentos||[]).filter(item=>monthKey(item.data||item.criadoEm)===state.dashboardMonth)),items=[...expenses];if(invested>0)items.push({label:"Investimentos",value:invested,color:"#4f46e5"});const spent=expenses.reduce((total,item)=>total+item.value,0),remaining=income-spent-invested;if(remaining>0)items.push({label:"Restante das entradas",value:remaining,color:"#10b981"});return {income,expenses,invested,spent,remaining,items}}
function drawDashboardDistribution(){const chart=$("#dashboardDistribution"),insights=$("#dashboardInsights");if(!chart||!insights)return;const data=dashboardDistributionData(),percent=value=>data.income>0?value/data.income*100:null;if(!data.income){chart.innerHTML=`<div class="empty">Cadastre entradas para ver como despesas e investimentos representam o seu dinheiro neste mês.</div>`;insights.innerHTML=`<div class="dashboard-insight">Assim que houver entradas registradas em ${esc(dashboardMonthLabel())}, o gráfico e as sugestões serão calculados automaticamente.</div>`;return}chart.innerHTML=data.items.length?data.items.map(item=>{const rate=percent(item.value),width=Math.min(100,rate||0),overflow=rate>100;return `<div class="dashboard-share-row"><div class="dashboard-share-heading"><strong>${esc(item.label)}</strong><span>${money(item.value)} · ${rate.toLocaleString("pt-BR",{maximumFractionDigits:1})}%</span></div><div class="dashboard-share-track" role="img" aria-label="${esc(item.label)} representa ${rate.toLocaleString("pt-BR",{maximumFractionDigits:1})}% das entradas"><div class="dashboard-share-fill${overflow?" over-budget":""}" style="width:${width}%;background:${item.color}"></div></div></div>`}).join(""):`<div class="empty">Nenhuma despesa ou aplicação registrada neste mês.</div>`;const tips=[];if(data.remaining<0)tips.push(`<strong>Atenção:</strong> despesas e investimentos ultrapassaram as entradas em ${money(Math.abs(data.remaining))}. Revise os próximos gastos para evitar fechar o mês no vermelho.`);if(data.expenses.length){const top=data.expenses[0],rate=percent(top.value);tips.push(`A categoria com maior gasto é <strong>${esc(top.label)}</strong>, com ${money(top.value)} (${rate.toLocaleString("pt-BR",{maximumFractionDigits:1})}% das entradas). Avalie se há espaço para reduzir esse custo.`)}if(data.invested>0){const rate=percent(data.invested);tips.push(`Os investimentos registrados neste mês representam <strong>${rate.toLocaleString("pt-BR",{maximumFractionDigits:1})}%</strong> das entradas.`)}else tips.push("Nenhum investimento foi registrado neste mês. Se você investiu, cadastre a aplicação para incluí-la no resumo.");if(data.remaining>0)tips.push(`Após as despesas e os investimentos registrados, restam ${money(data.remaining)} (${percent(data.remaining).toLocaleString("pt-BR",{maximumFractionDigits:1})}% das entradas) sem destino registrado.`);insights.innerHTML=tips.map(tip=>`<div class="dashboard-insight">${tip}</div>`).join("")}
function drawChart(){const c=$("#mainChart");if(!c)return;const ctx=c.getContext("2d"),r=c.getBoundingClientRect(),dpr=devicePixelRatio||1;c.width=Math.max(300,r.width*dpr);c.height=240*dpr;ctx.scale(dpr,dpr);const w=c.width/dpr,h=240,ms=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);ms.push({k:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`,l:d.toLocaleDateString("pt-BR",{month:"short"}).replace(".","")})}const vals=ms.map(m=>({...m,a:sum(state.data.lancamentos.filter(x=>monthKey(x.data)===m.k&&x.tipo==="entrada")),b:sum(state.data.lancamentos.filter(x=>monthKey(x.data)===m.k&&x.tipo==="despesa"))})),max=Math.max(1,...vals.flatMap(x=>[x.a,x.b]));ctx.clearRect(0,0,w,h);ctx.strokeStyle="#e8ebf2";for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(30,20+i*54);ctx.lineTo(w-8,20+i*54);ctx.stroke()}vals.forEach((v,i)=>{const step=(w-45)/6,x=35+i*step,bw=Math.min(17,step*.28),base=h-30;ctx.fillStyle="#4f46e5";ctx.fillRect(x,base-v.a/max*180,bw,v.a/max*180);ctx.fillStyle="#f59e0b";ctx.fillRect(x+bw+4,base-v.b/max*180,bw,v.b/max*180);ctx.fillStyle="#8a94a6";ctx.font="10px system-ui";ctx.textAlign="center";ctx.fillText(v.l,x+bw+4,h-8)})}
function launchTable(items,compact=false){return `<div class="table-wrap"><table><thead><tr><th>Descrição</th><th>Tipo</th><th>Data</th><th>Categoria</th><th>Valor</th>${compact?"":"<th>Ações</th>"}</tr></thead><tbody>${items.map(x=>`<tr><td><strong>${esc(x.descricao)}</strong></td><td><span class="pill ${x.tipo==="entrada"?"green":"red"}">${x.tipo==="entrada"?"Entrada":"Despesa"}</span></td><td>${fmtDate(x.data)}</td><td>${esc(x.categoria||"Geral")}</td><td class="${x.tipo==="entrada"?"positive":"negative"}"><strong>${x.tipo==="entrada"?"+":"−"} ${money(x.valor)}</strong></td>${compact?"":`<td><button class="btn small" onclick="editRecord('lancamentos','${x.id}')">Editar</button> <button class="btn small danger" onclick="deleteRecord('lancamentos','${x.id}')">Excluir</button></td>`}</tr>`).join("")}</tbody></table></div>`}
function renderFinance(){const items=[...state.data.lancamentos].sort((a,b)=>(b.data||"").localeCompare(a.data||"")),filtered=items.filter(x=>(`${x.descricao} ${x.categoria} ${x.tipo}`.toLowerCase()).includes(state.search.toLowerCase()));return `${pageHead("Entradas e despesas","Registre e acompanhe o dinheiro que entra e sai.",`<div class="quick-actions"><button class="btn" onclick="openForm('lancamentos','entrada')">＋ Entrada</button><button class="btn primary" onclick="openForm('lancamentos','despesa')">− Despesa</button></div>`)}<div class="toolbar"><input class="search" placeholder="Pesquisar lançamentos..." value="${esc(state.search)}" oninput="setSearch(this.value)"><button class="btn" onclick="exportCSV('lancamentos')">Exportar CSV</button></div><section class="panel">${filtered.length?launchTable(filtered):`<div class="empty">Nenhum lançamento encontrado.</div>`}</section>`}
function statusPill(c){if(c.status==="pago"||c.status==="recebido")return `<span class="pill green">${c.status==="pago"?"Pago":"Recebido"}</span>`;if(c.vencimento<today())return `<span class="pill red">Atrasado</span>`;return `<span class="pill amber">Pendente</span>`}
function renderAccounts(){const items=state.data.contas.filter(c=>(`${c.descricao} ${c.tipo} ${c.status} ${c.nome||""}`.toLowerCase()).includes(state.search.toLowerCase())),pending=items.filter(c=>!isPaid(c));return `${pageHead("Contas a pagar e receber","Controle vencimentos, pendências e pagamentos.",`<div class="quick-actions"><button class="btn" onclick="openForm('contas','pagar')">＋ Conta a pagar</button><button class="btn primary" onclick="openForm('contas','receber')">＋ Conta a receber</button></div>`)}<div class="cards accounts-cards">${card("A pagar",money(sum(pending.filter(c=>c.tipo==="pagar"))),"↗","Em aberto","negative")}${card("A receber",money(sum(pending.filter(c=>c.tipo==="receber"))),"↙","Em aberto","positive")}${card("Saldo disponível",money(currentCashBalance()),"◈","Saldo inicial + recebimentos − pagamentos",currentCashBalance()>=0?"positive":"negative")}${card("Contas cadastradas",String(items.length),"▤","Neste filtro")}${card("Atrasadas",String(items.filter(c=>!isPaid(c)&&c.vencimento<today()).length),"◷","Precisam de atenção","negative")}</div><div class="toolbar"><input class="search" placeholder="Pesquisar contas..." value="${esc(state.search)}" oninput="setSearch(this.value)"><button class="btn" onclick="exportCSV('contas')">Exportar CSV</button></div><section class="panel">${items.length?`<div class="table-wrap"><table><thead><tr><th>Descrição</th><th>Tipo</th><th>Vencimento</th><th>Valor</th><th>Status</th><th>Ações</th></tr></thead><tbody>${items.sort((a,b)=>(a.vencimento||"").localeCompare(b.vencimento||"")).map(c=>`<tr><td><strong>${esc(c.descricao)}</strong><br>${esc(c.nome||"")}</td><td>${c.tipo==="pagar"?"A pagar":"A receber"}</td><td>${fmtDate(c.vencimento)}</td><td>${money(c.valor)}</td><td>${statusPill(c)}</td><td>${!isPaid(c)?`<button class="btn small" onclick="settleAccount('${c.id}')">Marcar ${c.tipo==="pagar"?"pago":"recebido"}</button> `:""}<button class="btn small" onclick="editRecord('contas','${c.id}')">Editar</button> function drawInvestmentChart(){const c=$("#investmentChart");if(!c)return;const ctx=c.getContext("2d"),r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1,w=Math.max(300,r.width);c.width=w*dpr;c.height=240*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);const h=240,items=state.data.investimentos||[],maxMonths=Math.max(1,...items.map(x=>Math.min(600,Number(x.prazoMeses)||0)));const values=[];for(let m=0;m<=maxMonths;m++){let balance=0,contributed=0;items.forEach(x=>{const sim=simulateInvestment(x,m);balance+=sim.net;contributed+=sim.contributed});values.push({m,balance,contributed})}const max=Math.max(1,...values.map(v=>Math.max(v.balance,v.contributed)));ctx.clearRect(0,0,w,h);ctx.font="10px system-ui";ctx.strokeStyle="#e5e7eb";ctx.fillStyle="#8a94a6";for(let i=0;i<4;i++){const y=18+i*55;ctx.beginPath();ctx.moveTo(38,y);ctx.lineTo(w-10,y);ctx.stroke()}const xAt=m=>38+(w-52)*(m/maxMonths),yAt=v=>h-28-(v/max)*(h-58);function line(key,color){ctx.beginPath();values.forEach((v,i)=>{const x=xAt(v.m),y=yAt(v[key]);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.stroke()}line("balance","#4f46e5");line("contributed","#10b981");ctx.fillStyle="#8a94a6";ctx.textAlign="center";[0,Math.round(maxMonths/4),Math.round(maxMonths/2),Math.round(maxMonths*3/4),maxMonths].forEach(m=>ctx.fillText(m+"m",xAt(m),h-8));if(!items.length){ctx.fillStyle="#8a94a6";ctx.textAlign="center";ctx.fillText("Cadastre um investimento para visualizar a projeção",w/2,h/2)}}
let simulatorLast=null;function calculateInvestmentSimulator(form){const fd=new FormData(form),v=Object.fromEntries(fd.entries()),months=Math.max(1,Math.min(600,Math.round((Number(v.tempo)||1)*(v.unidade==="anos"?12:1)))),initial=Math.max(0,Number(v.valorInicial)||0),aporte=Math.max(0,Number(v.aporte)||0);let rate=0;if(v.tipo==="CDI")rate=Math.max(0,Number(v.taxaCDI)||0)*Math.max(0,Number(v.percentualCDI)||0)/100;else if(v.tipo==="poupanca")rate=Math.max(0,Number(v.taxaAnual)||0);else rate=Math.max(0,Number(v.taxaAnual)||0);const rm=Math.pow(1+rate/100,1/12)-1;let balance=initial,contributed=initial,points=[{m:0,balance,contributed}];for(let m=1;m<=months;m++){balance=balance*(1+rm)+aporte;contributed+=aporte;points.push({m,balance,contributed})}const tax=Math.max(0,Math.min(100,Number(v.imposto)||0)),grossGain=Math.max(0,balance-contributed),net=balance-grossGain*tax/100;simulatorLast={months,initial,aporte,rate,contributed,gross:balance,net,gain:net-contributed,points};return simulatorLast}

function drawSimulatorChart(){const c=$("#simulatorChart");if(!c||!simulatorLast)return;const ctx=c.getContext("2d"),r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1,w=Math.max(300,r.width);c.width=w*dpr;c.height=240*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);const h=240,p=simulatorLast.points,max=Math.max(1,...p.map(x=>Math.max(x.balance,x.contributed))),xAt=m=>38+(w-52)*(m/Math.max(1,simulatorLast.months)),yAt=n=>h-28-(n/max)*(h-58);ctx.clearRect(0,0,w,h);ctx.font="10px system-ui";ctx.strokeStyle="#e5e7eb";for(let i=0;i<4;i++){const y=18+i*55;ctx.beginPath();ctx.moveTo(38,y);ctx.lineTo(w-10,y);ctx.stroke()}[["balance","#4f46e5"],["contributed","#10b981"]].forEach(([key,color])=>{ctx.beginPath();p.forEach((v,i)=>{const x=xAt(v.m),y=yAt(v[key]);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.stroke()});ctx.fillStyle="#8a94a6";ctx.textAlign="center";[0,Math.round(simulatorLast.months/4),Math.round(simulatorLast.months/2),Math.round(simulatorLast.months*3/4),simulatorLast.months].forEach(m=>ctx.fillText(m+"m",xAt(m),h-8))}

function answerQuestion(q){const raw=String(q||"").trim(),s=raw.toLowerCase(),l=currentLaunches(),ins=sum(l.filter(x=>x.tipo==="entrada")),outs=sum(l.filter(x=>x.tipo==="despesa"));if(/^(oi|olá|ola|bom dia|boa tarde|boa noite|e aí|eai|tudo bem)[!.? ]*$/.test(s))return "Oi! 😊 Tudo bem por aqui. O que você quer saber? Pode me perguntar sobre o financeiro, contas, investimentos, estoque, clientes ou equipe.";if(s.includes("ajuda")||s.includes("o que você faz")||s.includes("o que sabe"))return "Posso ajudar a consultar os dados registrados: entradas e despesas do mês, resultado financeiro, contas atrasadas, investimentos cadastrados e projeções, produtos com estoque baixo, clientes, funcionários e gestores. O que você gostaria de consultar?";if(s.includes("investimento")||s.includes("cdi")||s.includes("aplicaç")||s.includes("rendimento")){const arr=state.data.investimentos||[];if(!arr.length)return "Ainda não há investimentos cadastrados. Abra a aba Investimentos para cadastrar o que você já tem ou use o Simulador completo para informar o valor inicial, os aportes mensais, o prazo e a taxa estimada.";const total=arr.reduce((a,x)=>a+(Number(x.valor)||0),0),proj=arr.reduce((a,x)=>a+simulateInvestment(x).net,0);return `Você tem ${arr.length} investimento(s) cadastrado(s), com ${money(total)} de valor inicial registrado. A projeção conjunta ao fim dos prazos cadastrados é de aproximadamente ${money(proj)}. Para testar outro prazo ou aporte, use o Simulador completo na aba Investimentos.`;}if(s.includes("entrou")||s.includes("entrada")||s.includes("fatur"))return `As entradas registradas neste mês somam ${money(ins)}.`;if(s.includes("gastei")||s.includes("despesa")||s.includes("gast"))return `As despesas registradas neste mês somam ${money(outs)}.`;if(s.includes("resultado")||s.includes("lucro")||s.includes("saldo"))return `O resultado dos lançamentos deste mês é ${money(ins-outs)} (entradas menos despesas). Isso não é necessariamente o saldo bancário real.`;if(s.includes("a function openProductSale(productId=""){const products=state.data.produtos.filter(product=>Number(product.quantidade)>0);if(!products.length){toast("Não há produtos com estoque disponível para vender.");return}if(productId&&!products.some(product=>product.id===productId)){toast("Este produto não tem estoque disponível.");return}const selected=products.find(product=>product.id===productId)||products[0];$("#modalTitle").textContent="Registrar venda de produto";$("#modalBody").innerHTML=`<form id="productSaleForm" novalidate><div class="notice">A venda será adicionada às entradas do financeiro e a quantidade será descontada do estoque.</div><div class="form-grid"><div class="field full"><label>Produto</label><select name="produtoId">${products.map(product=>`<option value="${esc(product.id)}" ${product.id===selected.id?"selected":""}>${esc(product.nome)} · ${Number(product.quantidade)} em estoque</option>`).join("")}</select></div><div class="field"><label>Cliente / comprador</label><input name="comprador" list="saleCustomers" autocomplete="off"><datalist id="saleCustomers">${state.data.clientes.map(client=>`<option value="${esc(client.nome)}"></option>`).join("")}</datalist></div><div class="field"><label>Quantidade</label><input name="quantidade" type="number" min="1" max="${Number(selected.quantidade)}" step="1" value="1"><small id="saleStockNote">Disponível: ${Number(selected.quantidade)} unidade(s)</small></div><div class="field"><label>Preço unitário (R$)</label><input name="precoUnitario" type="number" min="0.01" step="0.01" value="${Number(selected.preco)||0}"></div><div class="field"><label>Data da venda</label><input name="data" type="date" value="${today()}"></div><div class="field full"><strong>Total da venda: <span id="saleTotal">${money(Number(selected.preco)||0)}</span></strong></div><div class="field full"><label>Observações</label><textarea name="observacoes" rows="2"></textarea></div></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="confirmProductSale" type="submit">Confirmar venda</button></div></form>`;$("#modalBackdrop").classList.add("open");const form=$("#productSaleForm"),refreshSaleDetails=()=>{const product=products.find(item=>item.id===form.elements.namedItem("produtoId").value);if(!product)return;form.elements.namedItem("quantidade").max=String(Number(product.quantidade));$("#saleStockNote").textContent=`Disponível: ${Number(product.quantidade)} unidade(s)`;const qty=Math.max(0,Number(form.elements.namedItem("quantidade").value)||0),unitPrice=Math.max(0,Number(form.elements.namedItem("precoUnitario").value)||0);$("#saleTotal").textContent=money(qty*unitPrice)};form.addEventListener("input",refreshSaleDetails);form.elements.namedItem("produtoId").addEventListener("change",()=>{const product=products.find(item=>item.id===form.elements.namedItem("produtoId").value);if(product){form.elements.namedItem("quantidade").value="1";form.elements.namedItem("precoUnitario").value=String(Number(product.preco)||0)}refreshSaleDetails()});let saving=false;form.addEventListener("submit",async event=>{event.preventDefault();if(saving)return;const fields=new FormData(form),product=state.data.produtos.find(item=>item.id===fields.get("produtoId")),quantity=Number(fields.get("quantidade")),unitPrice=Number(fields.get("precoUnitario")),buyer=String(fields.get("comprador")||"").trim(),date=String(fields.get("data")||"");if(!product){toast("Selecione um produto válido.");return}if(!buyer){toast("Informe o nome do cliente ou comprador.");form.elements.namedItem("comprador").focus();return}if(!Number.isInteger(quantity)||quantity<1||quantity>Number(product.quantidade)){toast(`Quantidade inválida. Há ${Number(product.quantidade)} unidade(s) disponível(is).`);form.elements.namedItem("quantidade").focus();return}if(!Number.isFinite(unitPrice)||unitPrice<=0){toast("Informe um preço unitário maior que zero.");form.elements.namedItem("precoUnitario"). function drawProjection(id,points,months){const z=chartCanvas(id);if(!z||!points.length)return;const {ctx,w,h}=z,t=chartTheme(),maxMonth=Math.max(1,months),left=w<420?61:82,pad={left,right:28,top:24,bottom:42},plotW=w-pad.left-pad.right,plotH=h-pad.top-pad.bottom,max=Math.max(1,...points.map(p=>Math.max(p.balance,p.contributed))),xAt=m=>pad.left+plotW*(m/maxMonth),yAt=v=>pad.top+plotH-(v/max)*plotH,monthOf=p=>p.month??p.m;ctx.font="10px system-ui";ctx.textBaseline="middle";ctx.textAlign="right";for(let i=0;i<=4;i++){const value=max*(1-i/4),y=pad.top+plotH*i/4;ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(w-pad.right,y);ctx.strokeStyle=t.line;ctx.lineWidth=1;ctx.stroke();ctx.fillStyle=t.muted;ctx.fillText(compactMoney(value),pad.left-9,y)}const last=points[points.length-1],first=points[0];ctx.beginPath();points.forEach((p,i)=>{const x=xAt(monthOf(p)),y=yAt(p.balance);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});for(let i=points.length-1;i>=0;i--){const p=points[i];ctx.lineTo(xAt(monthOf(p)),yAt(p.contributed))}ctx.closePath();const fill=ctx.createLinearGradient(0,pad.top,0,pad.top+plotH);fill.addColorStop(0,"#4f46e533");fill.addColorStop(1,"#4f46e505");ctx.fillStyle=fill;ctx.fill();function strokeSeries(key,color,width,dash=[]){ctx.beginPath();points.forEach((p,i)=>{const x=xAt(monthOf(p)),y=yAt(p[key]);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineJoin="round";ctx.lineCap="round";ctx.setLineDash(dash);ctx.stroke();ctx.setLineDash([])}strokeSeries("contributed",t.green,2,[5,5]);strokeSeries("balance",t.primary,3);const endX=xAt(monthOf(last)),balanceY=yAt(last.balance),contributedY=yAt(last.contributed);ctx.beginPath();ctx.arc(endX,balanceY,5,0,Math.PI*2);ctx.fillStyle=t.primary;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue("--panel").trim()||"#fff";ctx.stroke();ctx.beginPath();ctx.arc(endX,contributedY,4,0,Math.PI*2);ctx.fillStyle=t.green;ctx.fill();const ticks=[ function validReportISO(value){const match=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value||""));if(!match)return false;const date=new Date(Number(match[1]),Number(match[2])-1,Number(match[3]));return reportISODate(date)===value}
function selectedReportRange(){if(state.reportPeriod==="custom"){const startKey=state.reportStart||today(),endKey=state.reportEnd||today();if(!validReportISO(startKey)||!validReportISO(endKey)||startKey>endKey)return null;const start=reportDateObject(startKey),end=reportDateObject(endKey);return {start,end,startKey,endKey,label:`${fmtDate(startKey)} a ${fmtDate(endKey)}`}}return reportRange()}
function reportRangeItems(range){return range?state.data.lancamentos.filter(x=>{const date=String(x.data||"").slice(0,10);return validReportISO(date)&&date>=range.startKey&&date<=range.endKey}).sort((a,b)=>(b.data||"").localeCompare(a.data||"")):[]}
function reportRangeBuckets(items,range){if(!range)return [];let spans=[];if(state.reportPeriod==="week"){for(let i=0;i<7;i++){const start=new Date(range.start);start.setDate(start.getDate()+i);spans.push({start,end:new Date(start)})}}else if(state.reportPeriod==="year"){for(let i=0;i<12;i++)spans.push({start:new Date(range.start.getFullYear(),i,1),end:new Date(range.start.getFullYear(),i+1,0)})}else if(state.reportPeriod==="month"){for(let day=1;day<=range.end.getDate();day+=7)spans.push({start:new Date(range.start.getFullYear(),range.start.getMonth(),day),end:new Date(range.start.getFullYear(),range.start.getMonth(),Math.min(day+6,range.end.getDate()))})}else{const dayCount=Math.round((range.end-range.start)/86400000)+1,step=dayCount<=31?1:7;for(let offset=0;offset<dayCount;offset+=step){const start=new Date(range.start);start.setDate(start.getDate()+offset);const end=new Date(start);end.setDate(end.getDate()+Math.min(step,dayCount-offset)-1);spans.push({start,end})}}const buckets=spans.map(({start,end})=>{const startKey=reportISODate(start),endKey=reportISODate(end);let label,detail;if(state.reportPeriod==="week"||state.reportPeriod==="custom"&&startKey===endKey){label=start.toLocaleDateString("pt-BR",{weekday:"short"}).replace(".","");detail=fmtDate(startKey)}else if(state.reportPeriod==="year"){label=start.toLocaleDateString("pt-BR",{month:"short"}).replace(".","");detail=start.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}else{label=`${start.getDate()}–${end.getDate()}`;detail=`${fmtDate(startKey)} – ${fmtDate(endKey)}`}return {startKey,endKey,label,detail,entradas:0,despesas:0,count:0}});items.forEach(item=>{const date=String(item.data||"").slice(0,10),bucket=buckets.find(candidate=>date>=candidate.startKey&&date<=candidate.endKey);if(!bucket)return;if(item.tipo==="entrada")bucket.entradas+=Number(item.valor)||0;if(item.tipo==="despesa")bucket.despesas+=Number(item.valor)||0;bucket.count++});return buckets}
function setReportView(period){if(!["week","month","year","custom"].includes(period))return;state.reportPeriod=period;render()}
function setReportReferenceDate(value){if(!validReportISO(value))return;state.reportDate=value;render()}
function setCustomReportDate(which,value){if(!["start","end"].includes(which)||!validReportISO(value))return;state[which==="start"?"reportStart":"reportEnd"]=value;render()}

function drawPeriodReportChart(){const chart=chartCanvas("reportChart");if(!chart)return;const range=selectedReportRange(),items=reportRangeItems(range),buckets=reportRangeBuckets(items,range),{ctx,w,h}=chart,theme=chartTheme();if(!buckets.length){ctx.fillStyle=theme.muted;ctx.font="13px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("Selecione um intervalo válido para ver os dados",w/2,h/2);return}if(state.chartModes.reports==="pie"){drawPieChart(chart,[{label:"Entradas",value:sum(items.filter(item=>item.tipo==="entrada")),color:theme.primary},{label:"Despesas",value:sum(items.filter(item=>item.tipo==="despesa")),color:theme.amber}]);return}const pad={left:w<480?63:78,right:16,top:18,bottom:36},max=Math.max(1,...buckets.flatMap(bucket=>[bucket.entradas,bucket.despesas])),plotH=chartGrid(ctx,w,h,max,pad,theme),plotW=w-pad.left-pad.right,step=plotW/buckets.length,barWidth=Math.min(22,Math.max(5,step*.28)),base=h-pad.bottom;buckets.forEach((bucket,index)=>{const center=pad.left+step*(index+.5);[[bucket.entradas,theme.primary,-barWidth-2],[bucket.despesas,theme.amber,2]].forEach(([value,color,offset])=>{const height=value/max*plotH;if(!height)return;ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(center+offset,base-height,barWidth,height,Math.min(5,barWidth/2));ctx.fill()});ctx.fillStyle=theme.muted;ctx.font="10px system-ui";ctx.textAlign="center";ctx.textBaseline="alphabetic";ctx.fillText(bucket.label,center,h-9)})}
